<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Atskoba — 3D & motion websites</title>
  <meta name="description" content="Atskoba is an independent Tbilisi studio crafting premium websites with 3D, WebGL and motion." />
  <meta name="theme-color" content="#eeece7" />
  <meta property="og:title" content="Atskoba — 3D & motion websites" />
  <meta property="og:description" content="Premium websites with 3D, WebGL and motion. Independent studio, Tbilisi." />
  <meta property="og:image" content="/og.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@500&display=swap" rel="stylesheet" />
  <noscript><style>.curtain{display:none}</style></noscript>
</head>
<body data-page="home">
  <div class="curtain" id="curtain" aria-hidden="true">
    <svg class="curtain-mark" viewBox="6 26 92 68" aria-hidden="true">
      <path class="cm-ring" fill="none" stroke="currentColor" stroke-width="15" d="M40 37.5a22.5 22.5 0 1 0 0.01 0z" />
      <rect class="cm-stem" x="60" y="30" width="15" height="60" fill="currentColor" />
      <circle class="cm-dot" cx="88" cy="83" r="7" />
    </svg>
  </div>

  <div class="progress" aria-hidden="true"><i id="progress"></i></div>
  <header class="nav" id="nav">
    <a class="logo" href="/" aria-label="Atskoba — home" data-nav>
      <svg class="logo-mark" viewBox="6 26 92 68" aria-hidden="true">
        <path fill-rule="evenodd" d="M40 30a30 30 0 1 0 0.01 0zM40 45a15 15 0 1 1-0.01 0z" />
        <rect x="60" y="30" width="15" height="60" />
        <circle class="dot" cx="88" cy="83" r="7" />
      </svg>
      <span class="logo-word">atskoba</span>
    </a>
    <nav class="nav-links" aria-label="Main">
      <a href="/work/" data-nav data-i18n="nav.work">Work</a>
      <a href="/#services" data-i18n="nav.services">Services</a>
      <a href="/#approach" data-i18n="nav.approach">Approach</a>
      <a href="/#contact" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="nav-right">
      <div class="langs" role="group" aria-label="Language">
        <button data-lang="en">EN</button><button data-lang="ka">ქა</button><button data-lang="ru">RU</button>
      </div>
      <button class="sound" id="sound" aria-pressed="false" aria-label="Sound"><span class="bars"><i></i><i></i><i></i><i></i></span></button>
      <a class="pill nav-cta" href="/#contact"><span data-i18n="nav.cta">Let’s talk</span></a>
      <button class="burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i></button>
    </div>
  </header>

  <div class="menu" id="menu" aria-hidden="true">
    <nav class="menu-links">
      <a href="/work/" data-nav data-i18n="nav.work">Work</a>
      <a href="/#services" data-i18n="nav.services">Services</a>
      <a href="/#approach" data-i18n="nav.approach">Approach</a>
      <a href="/#contact" data-i18n="nav.contact">Contact</a>
    </nav>
  </div>

  <canvas id="gl" aria-hidden="true"></canvas>

  <main id="top">
    <section class="hero" id="hero">
      <h1 class="hero-title">
        <span class="ln"><span data-i18n="hero.l1">We craft</span></span>
        <span class="ln"><span data-i18n="hero.l2">websites that</span></span>
        <span class="ln"><em class="serif" data-i18n="hero.l3">feel alive.</em></span>
      </h1>
      <div class="hero-bottom">
        <p class="hero-note fade-up" data-i18n="hero.note"></p>
        <p class="avail fade-up"><span class="pulse"></span><span data-i18n="hero.avail"></span></p>
        <p class="scroll-hint fade-up"><span data-i18n="hero.scroll"></span><i></i></p>
      </div>
    </section>

    <section class="statement">
      <p class="statement-text lines" data-i18n="statement"></p>
    </section>

    <section class="featured" id="work">
      <header class="sec-head">
        <p class="kicker" data-i18n="work.kicker"></p>
        <h2 class="h2 lines" data-i18n="work.title"></h2>
      </header>
      <div id="featured"></div>
      <header class="sec-head more-head">
        <p class="kicker" data-i18n="work.more"></p>
      </header>
      <div class="grid grid-home" id="highlights"></div>
      <div class="all-wrap">
        <a class="pill pill-lg pill-dark" href="/work/" data-nav><span data-i18n="work.all"></span><span class="count" id="allCount"></span><i class="arrow">→</i></a>
      </div>
    </section>

    <section class="svc3d" id="services">
      <div class="svc-pin">
        <div class="svc-copy">
          <p class="kicker" data-i18n="svc.kicker"></p>
          <h2 class="h2 lines" data-i18n="svc.title"></h2>
          <div class="chapters" id="chapters">
            <article class="chap is-on"><h3 class="chap-t"><span class="ln"><span data-i18n="svc.1.t"></span></span></h3><p class="chap-d" data-i18n="svc.1.d"></p></article>
            <article class="chap"><h3 class="chap-t"><span class="ln"><span data-i18n="svc.2.t"></span></span></h3><p class="chap-d" data-i18n="svc.2.d"></p></article>
            <article class="chap"><h3 class="chap-t"><span class="ln"><span data-i18n="svc.3.t"></span></span></h3><p class="chap-d" data-i18n="svc.3.d"></p></article>
            <article class="chap"><h3 class="chap-t"><span class="ln"><span data-i18n="svc.4.t"></span></span></h3><p class="chap-d" data-i18n="svc.4.d"></p></article>
          </div>
          <div class="chap-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
    </section>

    <section class="approach" id="approach">
      <div class="app-side">
        <p class="kicker" data-i18n="app.kicker"></p>
        <h2 class="h2 lines" data-i18n="app.title"></h2>
      </div>
      <ol class="app-steps">
        <li class="step"><h3 data-i18n="app.1.t"></h3><p data-i18n="app.1.d"></p></li>
        <li class="step"><h3 data-i18n="app.2.t"></h3><p data-i18n="app.2.d"></p></li>
        <li class="step"><h3 data-i18n="app.3.t"></h3><p data-i18n="app.3.d"></p></li>
        <li class="step"><h3 data-i18n="app.4.t"></h3><p data-i18n="app.4.d"></p></li>
      </ol>
    </section>

    <div class="ticker" aria-hidden="true"><div class="ticker-in" id="ticker"></div></div>
  </main>

  <footer class="contact" id="contact">
    <div class="contact-inner">
      <p class="kicker" data-i18n="cta.kicker"></p>
      <h2 class="cta-title">
        <span class="ln"><span data-i18n="cta.l1"></span></span>
        <span class="ln"><em class="serif" data-i18n="cta.l2"></em></span>
      </h2>
      <p class="cta-sub fade-up" data-i18n="cta.sub"></p>
      <a class="cta-mail fade-up" id="ctaMail" href="mailto:hello@atskoba.com"><span id="ctaMailText">hello@atskoba.com</span><i class="arrow">↗</i></a>
      <div class="cta-actions fade-up">
        <a class="pill pill-lg pill-light" id="mailBtn" href="mailto:hello@atskoba.com"><span data-i18n="cta.mail"></span><i class="arrow">↗</i></a>
        <a class="pill pill-lg pill-ghost" id="upworkBtn" href="#" target="_blank" rel="noopener" hidden><span data-i18n="cta.upwork"></span><i class="arrow">↗</i></a>
      </div>
    </div>
    <div class="foot">
      <div class="foot-brand">
        <svg class="logo-mark" viewBox="6 26 92 68" aria-hidden="true"><path fill-rule="evenodd" d="M40 30a30 30 0 1 0 0.01 0zM40 45a15 15 0 1 1-0.01 0z" /><rect x="60" y="30" width="15" height="60" /><circle class="dot" cx="88" cy="83" r="7" /></svg>
        <span>Atskoba · <span data-i18n="foot.city"></span></span>
      </div>
      <p>© 2026 Atskoba. <span data-i18n="foot.rights"></span></p>
      <a href="#top" class="to-top" data-i18n="foot.top"></a>
    </div>
  </footer>

  <div class="cursor" id="cursor" aria-hidden="true"><span id="cursorLabel"></span></div>
  <script type="module" src="/src/home.js"></script>
</body>
</html>
